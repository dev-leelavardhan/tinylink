name: CD

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/server

jobs:
  build-and-push:
    name: Build and push container images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # for cosign keyless signing
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      migrate_image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-migrate
      digest: ${{ steps.build-app.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Slim runtime image (production target). Deployed by immutable SHA tag.
      - name: Build and push app image
        id: build-app
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      # Migrator image (Prisma CLI + schema + migrations) for the one-shot job.
      - name: Build and push migrator image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          target: migrator
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-migrate
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      # Fail the build on HIGH/CRITICAL image vulnerabilities.
      - name: Scan app image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0 # TODO: pin to commit SHA
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Install cosign
        uses: sigstore/cosign-installer@v3 # TODO: pin to commit SHA

      - name: Sign images (keyless)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}@${{ steps.build-app.outputs.digest }}"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Deploy over SSH (compose)
        uses: appleboy/ssh-action@v1 # TODO: pin to commit SHA
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_IMAGE,DEPLOY_MIGRATE_IMAGE
          script: |
            set -euo pipefail
            cd /opt/tinylink

            # Preserve the currently deployed image for rollback.
            PREV_IMAGE="$(grep -E '^IMAGE=' .env | cut -d= -f2- || true)"
            PREV_MIGRATE_IMAGE="$(grep -E '^MIGRATE_IMAGE=' .env | cut -d= -f2- || true)"

            # Point compose at the new immutable SHA images.
            sed -i "s#^IMAGE=.*#IMAGE=${DEPLOY_IMAGE}#" .env || echo "IMAGE=${DEPLOY_IMAGE}" >> .env
            sed -i "s#^MIGRATE_IMAGE=.*#MIGRATE_IMAGE=${DEPLOY_MIGRATE_IMAGE}#" .env || echo "MIGRATE_IMAGE=${DEPLOY_MIGRATE_IMAGE}" >> .env

            # The VM must be pre-authenticated to GHCR (docker login ghcr.io)
            # or the images must be public.
            docker compose -f docker-compose.prod.yml pull

            # Apply migrations (one-shot), then roll the app + worker.
            docker compose -f docker-compose.prod.yml run --rm migrate
            docker compose -f docker-compose.prod.yml up -d --force-recreate app worker

            # Health gate: retry the readiness endpoint, roll back on failure.
            ok=0
            for i in $(seq 1 15); do
              if curl -sf http://127.0.0.1:3000/health/ready >/dev/null; then ok=1; break; fi
              sleep 4
            done

            if [ "$ok" -ne 1 ]; then
              echo "Health check failed - rolling back to ${PREV_IMAGE}"
              if [ -n "${PREV_IMAGE}" ]; then
                sed -i "s#^IMAGE=.*#IMAGE=${PREV_IMAGE}#" .env
                sed -i "s#^MIGRATE_IMAGE=.*#MIGRATE_IMAGE=${PREV_MIGRATE_IMAGE}#" .env
                docker compose -f docker-compose.prod.yml up -d --force-recreate app worker
              fi
              exit 1
            fi

            echo "Deploy healthy: ${DEPLOY_IMAGE}"
        env:
          DEPLOY_IMAGE: ${{ needs.build-and-push.outputs.image }}
          DEPLOY_MIGRATE_IMAGE: ${{ needs.build-and-push.outputs.migrate_image }}
