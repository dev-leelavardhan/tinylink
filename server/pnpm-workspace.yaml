packages:
  - '.'

# Force patched versions of vulnerable transitive dependencies
# (surfaced by `pnpm audit --prod --audit-level high`).
overrides:
  'fast-uri@>=3.0.0 <=3.1.3': '>=3.1.4'
  'js-yaml@>=5.0.0 <=5.2.1': '>=5.2.2'
  'brace-expansion@<=5.0.7': '>=5.0.8'

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  bcrypt: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  unrs-resolver: true
