# =============================================================================
# LOCAL DEVELOPMENT ONLY — do not use in production.
# Uses default credentials, publishes datastore ports to the host, and runs
# Redis without a password. For production use docker-compose.prod.yml.
# =============================================================================
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tinylink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tinylink}
      POSTGRES_DB: ${POSTGRES_DB:-tinylink}
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
  redis:
    image: redis:7
    ports: ['6379:6379']
  # Scrapes the API's /metrics endpoint. UI at http://localhost:9090.
  # Assumes the app runs on the host (`pnpm start:dev`); the scrape target
  # (host.docker.internal:3000) is configured in prometheus.yml.
  prometheus:
    image: prom/prometheus:latest
    ports: ['9090:9090']
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    extra_hosts:
      # Lets the container resolve the Docker host on Linux (already works on
      # Docker Desktop for macOS/Windows).
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
volumes:
  pgdata:
  promdata:
