# =============================================================================
# LOCAL DEVELOPMENT ONLY — do not use in production.
# Uses default credentials, publishes datastore ports to the host, and runs
# Redis without a password. For production use docker-compose.prod.yml.
# =============================================================================
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tinylink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tinylink}
      POSTGRES_DB: ${POSTGRES_DB:-tinylink}
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
  redis:
    image: redis:7
    ports: ['6379:6379']
volumes:
  pgdata:
