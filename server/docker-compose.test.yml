services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tinylink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tinylink}
      POSTGRES_DB: ${POSTGRES_DB:-tinylink_test}
    ports: ['5433:5432']
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tinylink} -d ${POSTGRES_DB:-tinylink_test}']
      interval: 2s
      timeout: 5s
      retries: 10
